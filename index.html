<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les Sorbiers – Entreprises intervenantes</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--prune:#43003a;--prune2:#7d4a73;--rouge:#b10f14;--fond:#f4eef2;--carte:#ffffff;--texte:#2a1426;--gris:#6d5a68}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Open Sans',Arial,sans-serif;background:var(--fond);color:var(--texte);line-height:1.4}
  header{background:var(--prune);color:#fff;padding:28px 16px 22px;text-align:center}
  header .client{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
  header h1{font-size:2.2rem;font-weight:800;letter-spacing:.04em;margin:4px 0}
  header .sous{font-size:1.05rem;font-weight:600}
  .bandeau{background:linear-gradient(90deg,var(--prune2),#e9dde6);color:#fff;padding:8px 16px;font-size:.85rem;font-weight:600;text-align:center}
  main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
  h2{font-size:1rem;text-transform:uppercase;letter-spacing:.06em;color:var(--prune);margin:26px 0 10px;border-left:5px solid var(--rouge);padding-left:10px}
  .grille{display:grid;gap:10px}
  .carte{background:var(--carte);border-radius:14px;padding:12px 14px;box-shadow:0 1px 3px rgba(67,0,58,.12);display:flex;gap:12px;align-items:center}
  .tag{background:var(--rouge);color:#fff;font-weight:700;font-size:.72rem;border-radius:8px;padding:4px 8px;min-width:46px;text-align:center;flex-shrink:0}
  .tag.role{background:var(--prune)}
  .info{min-width:0}
  .lot{font-size:.78rem;color:var(--gris);text-transform:uppercase;font-weight:600;letter-spacing:.03em}
  .nom{font-weight:700;font-size:1rem}
  .ville{font-size:.82rem;color:var(--gris)}
  .hero img{display:block;width:100%;max-height:420px;object-fit:cover}
  .galerie img{display:block;width:100%;border-radius:14px;box-shadow:0 1px 3px rgba(67,0,58,.12)}
  .tel{display:inline-block;margin-top:3px;font-size:.85rem;font-weight:600;color:var(--rouge);text-decoration:none}
  footer{text-align:center;font-size:.75rem;color:var(--gris);padding:20px 16px 30px}
</style>
</head>
<body>
<header>
  <div class="client">Les Nouveaux Constructeurs</div>
  <h1>LES SORBIERS</h1>
  <div class="sous">Construction de 91 logements</div>
</header>
<div class="bandeau">31 rue de Nantes – 44210 Pornic · PC 044 131 23 D1288</div>

<div class="hero"><img src="perspective-1.jpg" alt="Perspective du projet Les Sorbiers depuis la rue"></div>

<main>
  <div class="galerie">
    <img src="perspective-2.jpg" alt="Perspective du projet Les Sorbiers côté jardin">
  </div>

  <h2>Intervenants</h2>
  <div class="grille" id="intervenants"></div>

  <h2>Entreprises intervenant sur le chantier</h2>
  <div class="grille" id="entreprises"></div>
</main>

<footer>Liste mise à jour le 16/09/2026</footer>

<script>

rendu('entreprises', entreprises, false);
</script>
</body>
</html>
